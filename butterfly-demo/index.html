<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>蝴蝶圣诞树</title>
<style>
:root{color-scheme:dark;--ink:#f6f1e8;--muted:#a99f9b;--line:#403833;--surface:#171311;--accent:#d9c08a;--wash:#35291e}
*{box-sizing:border-box}
body{margin:0;background:#080706;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
main{width:100%;max-width:460px;margin:auto;min-height:100vh;background:#0e0c0b}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #302824;background:#100e0d}
h1{font-family:"Songti SC",serif;font-size:19px;letter-spacing:.08em;font-weight:600;margin:0;color:#f4ead8}
.steps{display:flex;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}
.steps span+span{margin-left:11px}
.steps [aria-current]{color:#e7cb91}
.stage{position:relative;overflow:hidden;background:#050505}
#scene{display:block;width:100%;touch-action:none;cursor:crosshair}
#effects{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.hintbar{min-height:38px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#b8aaa0;font-size:11px;border-top:1px solid #342c26;border-bottom:1px solid #342c26;background:#110e0c}
.hintbar button{border:0;background:none;color:#e1c68d;padding:10px 0 10px 10px;font-size:11px;white-space:nowrap}
.hintbar button:disabled{color:#8692aa;opacity:.65;cursor:default}
.panel{padding:15px 16px 18px;background:#171311}
fieldset{margin:0 0 15px;padding:0;border:0;min-width:0}
legend{font-weight:650;padding:0;margin-bottom:8px;font-size:12px;letter-spacing:.04em;color:#ead7b6}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:5px}
#palettes{grid-template-columns:repeat(3,minmax(0,1fr))}
#background-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.color-pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 5px}
.color-pickers label{min-height:39px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;border:1px solid #443a33;background:#201b18;color:#d1c6ba;font-size:11px}
.color-pickers input[type=color]{width:36px;height:28px;padding:2px;border:1px solid #675b50;background:#171311;cursor:pointer}
.palette-note{margin:3px 0 0;color:#a99f9b;font-size:10px;line-height:1.4}
.butterfly-tools{padding:11px 12px 12px;border:1px solid #514237;border-radius:4px;margin-bottom:15px;background:#1c1713}
.butterfly-tools fieldset{margin-bottom:9px}
.butterfly-tools legend{font-size:11px}
.butterfly-tools label{font-size:11px;color:var(--muted);display:block}
.butterfly-tools output{float:right}
.tool-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tool-title{font-size:12px;font-weight:650;margin:0;color:#e5c88e}
#deselect{background:transparent;border:0;color:var(--muted);font-size:11px;padding:4px 3px}
.choices button{min-height:36px;min-width:0;padding:4px 1px;border-radius:3px;background:#201b18;color:#c9bfb5;border:1px solid #443a33;font-size:11px;white-space:nowrap;transition:background .16s,border-color .16s,color .16s}
.choices button[aria-pressed=true]{border-color:#d1b77f;background:#35291e;color:#fff6e6;box-shadow:inset 0 -2px #c6a66a}
#palettes button{min-height:48px}
.swatch{display:block;width:26px;height:8px;border-radius:1px;margin:1px auto 4px;border:1px solid #ffffff38}
.sliders{display:grid;grid-template-columns:1.12fr 1fr 1fr;grid-gap:10px;margin:0 0 17px}
.sliders label{font-weight:600;display:block;font-size:11px}
.sliders output{float:right;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{display:block;height:24px;margin:1px 0 0;width:100%;accent-color:#d9bd82}
.actions{display:flex;align-items:stretch}
.actions button,.return{min-height:41px;border:1px solid #665644;border-radius:3px;background:none;color:var(--ink);padding:0 11px;font-size:12px}
.actions .primary{flex:1;margin-left:8px;border-color:transparent;background:linear-gradient(110deg,#e5d4ad,#c4a56c);color:#23190f;font-weight:750}
#card-panel .actions{margin-top:10px}
#card-panel label{display:block;color:var(--muted);margin-bottom:6px;font-size:12px}
#name{width:100%;height:40px;border-radius:3px;border:1px solid #665644;background:#100e0d;color:var(--ink);padding:0 10px}
#result{font-size:12px;color:var(--muted);margin:10px 0 0}
#result:empty{display:none}
@media(max-width:350px){.panel{padding-left:10px;padding-right:10px}.choices button{font-size:10px}header{padding:0 12px}}
@media(min-width:800px){
body{padding:30px 26px}main{border:1px solid #40352b;border-radius:3px;max-width:1060px;min-height:0;overflow:hidden;box-shadow:0 24px 80px #0009}
header{padding:0 25px;height:64px}.workspace{display:grid;grid-template-columns:minmax(440px,1.25fr) minmax(370px,1fr)}
.panel{padding:23px 25px;border-left:1px solid #40352b}
fieldset{margin-bottom:18px}legend{font-size:13px}.choices button{min-height:39px}.sliders{margin-bottom:18px}
}
main{background:#080f1a;display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;max-width:600px;margin:auto;border:0;border-radius:0;overflow:hidden}
body{padding:0;background:#050912}header{height:48px;flex:none;background:#090f19;border-color:#273240}h1{color:#dcecff}.steps{display:none}
.workspace{display:flex;flex-direction:column;flex:1;min-height:0}.workspace>section:first-child{flex:1;min-height:0;display:flex;flex-direction:column}.stage{container-type:size;flex:1;display:grid;place-items:center;background:#04060d}
#scene,#effects{width:min(100cqw,91.12cqh);height:auto;aspect-ratio:390/428}
#effects{inset:50% auto auto 50%;transform:translate(-50%,-50%)}.hintbar{background:#090f19;border-color:#253042;color:#b1c6d8;min-height:28px}.hintbar button:disabled{visibility:hidden}
.panel,#launch{flex:none;border:0;background:#0c1420;padding:10px 16px max(12px,env(safe-area-inset-bottom))}
#launch,.brush,#tabs{display:flex;align-items:center;gap:8px}#launch button,.brush button,#tabs button{border:1px solid #435366;background:#131f2c;color:#deeeff;border-radius:20px;min-height:40px;padding:5px 14px}#launch button{flex:1}#launch #preview,.actions .primary{background:#d6ecff;color:#173249;border:0}#tabs button{flex:1}#tabs button[aria-pressed=true]{background:#d6ecff;color:#163148}
#tool-body{height:clamp(82px,17dvh,154px);overflow-y:auto;overscroll-behavior:contain;margin:9px 0}.brush{justify-content:space-between;font-size:12px}.panel legend{color:#d9eaff}.choices button,.butterfly-tools,.color-pickers label{background:#121e2c;color:#d7e5f1;border-color:#344453}.choices button[aria-pressed=true]{background:#243c52;border-color:#a6d7ff;box-shadow:none}.actions{gap:7px}.actions button{border-color:#495d70;border-radius:20px}.actions .primary{margin:0}.panel fieldset{margin-bottom:8px}
#music{margin-left:auto;padding:6px 12px;border-radius:20px;color:#cdeaff;border:1px solid #405163;background:#111c2a}#individual{display:flex;align-items:center;gap:10px}#individual label{flex:1}#individual input[type=color]{height:34px;width:100%}</style>
<script defer="" src="./wings.js"></script><script defer="" src="./backdrop.js"></script><script defer="" src="./tree.js"></script>
</head>
<body>
<main>
<header>
<h1>蝴蝶圣诞树</h1><button id="music" aria-pressed="false">♫ 音乐关</button>
<div aria-label="制作步骤" class="steps"><span aria-current="step" id="step-edit">装饰</span><span aria-hidden="true">›</span><span id="step-card">点亮贺卡</span></div>
</header>
<div class="workspace">
<section aria-label="蝴蝶树画布">
<div class="stage">
<canvas aria-describedby="hint" aria-label="蝴蝶树" id="scene" tabindex="0">需要支持 Canvas 的浏览器。</canvas>
<canvas aria-hidden="true" id="effects"></canvas>
</div>
<div class="hintbar"><span id="hint" role="status">点蝴蝶换色 · 拖动调整位置</span><button disabled="" id="remove" type="button">删除选中</button></div>
</section>
<section id="launch"><button id="decorate">装饰</button><button id="preview">✧ 点亮</button></section><section aria-label="树饰设置" class="panel" hidden="" id="edit-panel"><nav aria-label="装饰工具" id="tabs"><button data-tab="butterfly">蝴蝶</button><button data-tab="background">背景</button><button data-tab="lightfx">光效</button></nav><div id="tool-body"><div data-pane="background"><fieldset><legend>画笔</legend><div class="choices three" id="brushes"></div></fieldset><div class="brush"><span>轻点或滑动，成簇点缀</span><button disabled="" id="undo">撤销一笔</button></div></div><div data-pane="butterfly"><fieldset><legend id="individual-title">新蝴蝶</legend><div id="individual"><label>大小 <output id="wing-size-out">100%</output><input id="wing-size" type="range" min="45" max="180" value="100"></label><label>自选蝶色<input id="wing-color" type="color" value="#81c8ff"></label></div></fieldset><label for="opacity"><span id="opacity-scope">整树浓淡</span><output id="opacity-out">90%</output><input id="opacity" max="100" min="25" type="range" value="90"/></label><fieldset><legend>蝶形样式</legend><div class="choices three" id="styles"></div></fieldset><fieldset><legend>蝴蝶配色</legend><div class="choices" id="palettes"></div>
<div class="color-pickers">
<label for="rich-color"><span>主色</span><input aria-label="自选蝴蝶主色" id="rich-color" type="color" value="#4a9bff"/></label>
<label for="pale-color"><span>浅色</span><input aria-label="自选蝴蝶浅色" id="pale-color" type="color" value="#d4f7ff"/></label>
</div>
<p class="palette-note">主色比例控制蝶色分布；手动添蝶可单独选主色、浅色或双色。</p>
</fieldset><fieldset><legend>蝴蝶排布</legend><div class="choices three" id="layouts"></div></fieldset><div class="butterfly-tools">
<div class="tool-heading"><p class="tool-title" id="tool-title">新蝴蝶</p><button hidden="" id="deselect" type="button">取消选择</button></div>
<fieldset hidden="" id="single-style"><legend>当前蝶形</legend><div class="choices three" id="single-styles"></div></fieldset>
<fieldset><legend>蝴蝶颜色</legend><div class="choices three" id="butterfly-colors"></div></fieldset>

</div><div class="sliders">
<label for="rich">主色比例 <output id="rich-out">67%</output><input id="rich" max="100" min="0" type="range" value="67"/></label>
<label for="density">密度 <output id="density-out">45</output><input id="density" max="108" min="28" type="range" value="45"/></label>
<label for="size">大小 <output id="size-out">100%</output><input id="size" max="140" min="65" type="range" value="100"/></label>
</div></div><div data-pane="lightfx"><fieldset><legend>树周闪光</legend><div class="choices" id="effects-choices"><button aria-pressed="true" data-overlay="sparkle">星闪</button><button aria-pressed="false" data-overlay="bokeh">柔光斑</button></div></fieldset><fieldset><legend>顶部星形</legend><div class="choices" id="topper-choices"></div></fieldset></div></div>
<div class="actions"><button id="done">完成</button><button id="reset" type="button">重新生成</button><button class="primary" id="light" type="button">点亮圣诞树</button></div>
</section>
<section aria-label="贺卡设置" class="panel" hidden="" id="card-panel">
<label for="name">收卡人名字</label>
<input id="name" maxlength="24" placeholder="输入名字，写在贺卡上" type="text"/>
<label style="display:flex;align-items:center;gap:12px;margin-top:8px">赠语颜色 <input id="text-color" type="color" value="#e1f1ff"/> <small>拖动画布上的赠语调整位置</small></label><div class="actions"><button id="back" type="button">继续装饰</button><button class="primary" id="export" type="button">保存分享卡</button></div>
<p id="result" role="status"></p>
</section>
</div>
</main>
<script src="./bells.js"></script></body>
</html>
